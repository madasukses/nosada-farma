<style>
  /* ===== VARIABEL ===== */
  :root {
    --purple:       #534AB7;
    --purple-dark:  #3C3489;
    --purple-deep:  #26215C;
    --purple-light: #EEEDFE;
    --purple-mid:   #CECBF6;
    --gray-bg:      #F7F7FA;
    --gray-border:  #E4E3F0;
    --gray-text:    #5F5E5A;
    --white:        #FFFFFF;
    --green:        #1D9E75;
    --wa-green:     #25D366;
    --red-soft:     #FCEBEB;
    --red-text:     #A32D2D;
    --font-display: 'Syne', sans-serif;
    --font-body:    'Plus Jakarta Sans', sans-serif;
    --radius-sm:    8px;
    --radius-md:    12px;
    --radius-lg:    18px;
    --radius-xl:    24px;
  }

  /* ===== RESET ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--gray-bg);
    color: #2C2C2A;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--purple-deep);
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .brand-icon {
    width: 34px; height: 34px;
    background: var(--purple);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .brand-name {
    font-family: var(--font-display);
    font-size: 17px;
    color: white;
    letter-spacing: 0.3px;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--purple-mid);
    margin-top: 1px;
  }
  .header-search {
    flex: 1;
    max-width: 420px;
    position: relative;
  }
  .header-search input {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 30px;
    padding: 8px 16px 8px 38px;
    font-size: 14px;
    color: white;
    font-family: var(--font-body);
    outline: none;
    transition: background 0.2s, border-color 0.2s;
  }
  .header-search input::placeholder { color: rgba(255,255,255,0.45); }
  .header-search input:focus {
    background: rgba(255,255,255,0.16);
    border-color: var(--purple-mid);
  }
  .header-search .ico-search {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 15px;
    pointer-events: none;
  }
  .btn-wa-header {
    display: flex; align-items: center; gap: 6px;
    background: var(--wa-green);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: var(--font-body);
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .btn-wa-header:hover { opacity: 0.88; }

  /* ===== HERO BANNER ===== */
  .hero {
    background: var(--purple);
    padding: 24px 20px;
  }
  .hero-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .hero-text h1 {
    font-family: var(--font-display);
    font-size: 22px;
    color: white;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .hero-text p {

    color: var(--purple-mid);
    line-height: 1.5;
  }
  .hero-badges {

    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .hero-badge {

    border: 1px solid rgba(255,255,255,0.18);

  /* ===== MAIN ===== */

  /* ===== KATEGORI ===== */
  .cats-wrap { margin-bottom: 20px; }
  .cats-label {

  .cats {

  .status-count {
    font-size: 13px;
    color: var(--gray-text);
  }
  .status-count b { color: var(--purple-dark); }

  /* ===== GRID PRODUK ===== */
  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;

  .card {
    background: var(--white);
    border-radius: var(--radius-md);

    overflow: hidden;
    display: flex;

  /* ===== LOADING ===== */

    grid-column: 1/-1;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    padding: 48px;
    color: var(--gray-text);

  /* ===== SKELETON ===== */
  .skeleton-card {
    background: var(--white);
    border-radius: var(--radius-md);

  .konsul-avatar {

    background: var(--purple);

    font-family: var(--font-display);

  .konsul-text p { font-size: 12px; color: var(--purple-mid); }
  .btn-konsul {
    display: flex; align-items: center; gap: 6px;
    background: var(--wa-green);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-body);
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  /* ===== ERROR BANNER ===== */
  .error-banner {
    background: var(--red-soft);
    border: 1px solid #F7C1C1;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--red-text);
    margin-bottom: 16px;

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .header-search { display: none; }
    .brand-sub { display: none; }
    .hero-text h1 { font-size: 18px; }
    .products { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }

  /* ===== ANIMASI MASUK ===== */
  .card { animation: fadeUp 0.25s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<script>
// =============================================
// KONFIGURASI — GANTI BAGIAN INI
// =============================================
const SHEET_ID  = '1cBldbqvTBOs4GLZzL0d2fpxat-cbu3v7NlvGMlg1bLI';
const WA_NUMBER = '6285735013424';
// =============================================

const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;

// Indeks kolom (0-based) sesuai format Vmedis
const COL = {
  kode:     0,   // A - Kode Obat
  nama:     1,   // B - Nama Obat
  pabrik:   2,   // C - Pabrik
  golongan: 3,   // D - Golongan (OTC/resep)
  kategori: 4,   // E - Kategori
  stok:     10,  // K - Stok Obat
  satuan:   11,  // L - Satuan
  harga:    18,  // S - Harga Jual 1
};

// Ikon per kategori
const ICONS = {
  default:   '💊',
  topikal:   '🧴',
  vitamin:   '🌟',
  antibiotik:'💉',
  antifungi: '🍄',
  analgesik: '🩹',
  lambung:   '🫁',
  mata:      '👁️',
  tetes:     '💧',
  sirup:     '🧪',
  injeksi:   '💉',
  salep:     '🧴',
  kapsul:    '💊',
  tablet:    '💊',
};

function getIcon(kategori) {
  if (!kategori) return ICONS.default;
  const k = kategori.toLowerCase();
  for (const [key, val] of Object.entries(ICONS)) {
    if (k.includes(key)) return val;
  }
  return ICONS.default;
}

function parseNumber(val) {
  if (val === null || val === undefined) return 0;
  return parseFloat(String(val).replace(/,/g, '')) || 0;
}

function formatRp(n) {
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

function waLink(namaObat, satuan, harga) {
  const msg = encodeURIComponent(
    `Halo Nosada Farma 👋\nSaya ingin memesan:\n\n*${namaObat}* (${satuan})\nHarga: ${formatRp(harga)}\n\nApakah stok tersedia? Terima kasih.`
  );
  return `https://wa.me/${WA_NUMBER}?text=${msg}`;
}

let allData = [];
let activeCat = '';
let searchVal = '';

async function loadData() {
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('Gagal mengambil data');
    const text = await res.text();
    const json = JSON.parse(text.replace(/^.*?({.*}).*$/s, '$1'));
    const rows = json.table.rows;

    allData = rows.map(row => {
      const c = row.c || [];
      const val = (i) => c[i] ? (c[i].v !== null && c[i].v !== undefined ? c[i].v : '') : '';
      return {
        kode:     String(val(COL.kode) || '').trim(),
        nama:     String(val(COL.nama) || '').trim(),
        pabrik:   String(val(COL.pabrik) || '').trim(),
        golongan: String(val(COL.golongan) || '').trim().toUpperCase(),
        kategori: String(val(COL.kategori) || '').trim(),
        stok:     parseNumber(val(COL.stok)),
        satuan:   String(val(COL.satuan) || '').trim(),
        harga:    parseNumber(val(COL.harga)),
      };
    }).filter(d => d.nama && d.harga > 0);

    buildCategories();
    render();
  } catch (e) {
    showError('Gagal memuat data. Pastikan Google Sheets sudah diatur publik dan SHEET_ID sudah benar. (' + e.message + ')');
    document.getElementById('prodGrid').innerHTML = '';
    document.getElementById('statusCount').textContent = 'Gagal memuat';
  }
}

function buildCategories() {
  const cats = [...new Set(allData.map(d => d.kategori).filter(Boolean))].sort();
  const list = document.getElementById('catList');
  list.innerHTML = `<button class="cat active" onclick="filterCat('',this)">Semua</button>`;
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat';
    btn.textContent = cat;
    btn.onclick = () => filterCat(cat, btn);
    list.appendChild(btn);
  });
}

function filterCat(cat, el) {
  activeCat = cat;
  document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function onSearch(val) {
  searchVal = val;
  // sync kedua input
  document.getElementById('searchDesktop').value = val;
  document.getElementById('searchMobile').value = val;
  render();
}

function render() {
  const q = searchVal.toLowerCase().trim();
  let filtered = allData;

  if (activeCat) filtered = filtered.filter(d => d.kategori === activeCat);
  if (q) filtered = filtered.filter(d =>
    d.nama.toLowerCase().includes(q) ||
    d.kode.toLowerCase().includes(q) ||
    d.kategori.toLowerCase().includes(q)
  );

  const grid = document.getElementById('prodGrid');
  const count = document.getElementById('statusCount');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">🔍</div>
      <h3>Obat tidak ditemukan</h3>
      <p>Coba kata kunci lain atau tanya langsung ke apoteker</p>
    </div>`;
    count.innerHTML = `Menampilkan <b>0</b> produk`;
    return;
  }

  // Batasi tampil 60 produk untuk performa
  const shown = q || activeCat ? filtered : filtered.slice(0, 60);
  const isLimited = !q && !activeCat && filtered.length > 60;

  count.innerHTML = q || activeCat
    ? `Menampilkan <b>${filtered.length}</b> produk`
    : `Menampilkan <b>${shown.length}</b> dari <b>${filtered.length}</b> produk — gunakan pencarian untuk hasil spesifik`;

  grid.innerHTML = shown.map((d, i) => {
    const isOTC    = d.golongan === 'OTC' || d.golongan === 'BEBAS';
    const stokAda  = d.stok > 0;
    const icon     = getIcon(d.kategori);
    const badgeCls = isOTC ? 'badge-otc' : 'badge-resep';
    const badgeTxt = isOTC ? 'Bebas' : 'Resep';
    const stokCls  = stokAda ? 'stok-ada' : 'stok-habis';
    const stokTxt  = stokAda ? '● Stok tersedia' : '● Stok habis';
    const subTxt   = [d.pabrik, d.satuan].filter(Boolean).join(' · ') || d.kategori;
    const link     = stokAda ? waLink(d.nama, d.satuan, d.harga) : `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('Halo Nosada Farma, apakah ' + d.nama + ' sudah tersedia?')}`;
    const btnTxt   = stokAda ? 'Pesan' : 'Tanya';

    return `<div class="card" style="animation-delay:${(i % 20) * 25}ms">
      <div class="card-img">
        ${icon}
        <span class="card-badge ${badgeCls}">${badgeTxt}</span>
      </div>
      <div class="card-body">
        <div class="card-stok ${stokCls}">${stokTxt}</div>
        <div class="card-name">${d.nama}</div>
        <div class="card-sub">${subTxt}</div>
        <div class="card-footer">
          <span class="card-price">${formatRp(d.harga)}</span>
          <a class="btn-pesan" href="${link}" target="_blank">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.555 4.122 1.524 5.854L0 24l6.336-1.501A11.96 11.96 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.793 9.793 0 01-5.003-1.374l-.36-.214-3.727.882.925-3.618-.235-.372A9.793 9.793 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
            ${btnTxt}
          </a>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}

// Tampilkan search mobile di layar kecil
if (window.innerWidth <= 600) {
  document.getElementById('mobileSearchWrap').style.display = 'block';
}

loadData();
</script>
</body>
</html>
