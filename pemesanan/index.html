<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosada Farma - Sistem Pesanan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-page" class="login-page">
  <div class="login-box">
    <h1>Nosada Farma</h1>
    <p>Sistem Pesanan Obat</p>
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <button onclick="cekLogin()">Masuk</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-page" class="app-page" style="display:none;">

  <header>
    <div>
      <h1>Nosada Farma</h1>
      <div class="info" id="header-info">Belum ada data · Silakan import CSV</div>
    </div>
    <div class="actions">
      <button onclick="document.getElementById('file-harga').click()">📥 Import Harga.csv</button>
      <button onclick="document.getElementById('file-pbf').click()">📥 Import PBF.csv</button>
      <button onclick="logout()" class="btn-logout">Keluar</button>
    </div>
    <input type="file" id="file-harga" accept=".csv" style="display:none" onchange="handleUploadHarga(event)">
    <input type="file" id="file-pbf" accept=".csv" style="display:none" onchange="handleUploadPbf(event)">
  </header>

  <!-- LIST OBAT -->
  <div class="section-title">Daftar Obat (Termurah 1-3)</div>
  <div class="list-obat">
    <div class="search-bar">
      <input type="text" id="search-obat" placeholder="🔍 Cari nama obat..." oninput="renderListObat()">
    </div>
    <div class="scroll-box">
      <table class="obat-table">
        <thead>
          <tr>
            <th>Nama Obat</th>
            <th>Sisa</th>
            <th>Harga 1</th>
            <th>Harga 2</th>
            <th>Harga 3</th>
          </tr>
        </thead>
        <tbody id="list-obat-body">
          <tr><td colspan="5" class="empty-row">Belum ada data. Silakan import CSV.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- PANEL PBF -->
  <div class="section-title">Panel PBF (Keranjang Pesanan)</div>
  <div class="panel-scroll" id="panel-pbf-container">
    <div class="empty-panel-msg">Import PBF.csv untuk menampilkan panel.</div>
  </div>

</div>

<!-- ================= MODAL SEARCH ================= -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Tambah Obat <span class="pbf-name" id="modal-pbf">-</span></h3>
      <div class="close" onclick="closeModal()">×</div>
    </div>

    <!-- STEP 1: SEARCH -->
    <div id="step-search">
      <div class="modal-body">
        <input type="text" class="search-input" id="modal-search" placeholder="🔍 Ketik nama obat..." oninput="renderHasilCari()">
        <div class="hasil-list" id="hasil-list"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-batal" onclick="closeModal()">Batal</button>
      </div>
    </div>

    <!-- STEP 2: QTY -->
    <div id="step-qty" class="qty-step" style="display:none;">
      <div class="modal-body">
        <div class="obat-info">
          <div class="nama" id="qty-nama">-</div>
          <div class="harga">Harga: <span id="qty-harga">-</span></div>
        </div>
        <label>Jumlah (Qty)</label>
        <input type="number" class="qty-input" id="qty-input" value="1" min="1" oninput="hitungSubtotal()">
        <div class="preview-total">
          Subtotal: <strong id="qty-subtotal">Rp0</strong>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-batal" onclick="kembaliSearch()">← Kembali</button>
        <button class="btn-ok" onclick="konfirmasiTambah()">Tambah ke Keranjang</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="app.js"></script>

</body>
</html>
